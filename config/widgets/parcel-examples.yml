# Parcel Widget Configuration Examples
# Copy one of these configurations to widgets/parcel.yml or customize as needed

# ============================================
# VARIANT 1: Default - Active deliveries only
# Shows up to 3 deliveries, collapsible
# ============================================
- type: custom-api
  title: Parcel Deliveries
  cache: 1h
  method: GET
  url: https://api.parcel.app/external/deliveries/?filter_mode=active
  headers:
      api-key: ${PARCEL_API_KEY}
      Accept: application/json
  options:
      show-all: false
      collapse-after: 3
      max-description-length: 50
  template: |
      {{/* Check if the API request was successful */}}
      {{ $success := .JSON.Bool "success" }}
      {{ if not $success }}
        <div class="color-negative size-h4">
          Error: {{ .JSON.String "error_message" }}
        </div>
      {{ else }}
        {{ $deliveries := .JSON.Array "deliveries" }}
        {{ $showAll := .Options.BoolOr "show-all" false }}
        {{ $collapseAfter := .Options.IntOr "collapse-after" 3 }}
        {{ $maxDescLength := .Options.IntOr "max-description-length" 50 }}

        {{/* Show count of active deliveries */}}
        {{ $count := len $deliveries }}
        {{ if eq $count 0 }}
          <div class="flex justify-center text-center">
            <div class="color-subdue size-h4">No active deliveries</div>
          </div>
        {{ else }}
          <div class="flex justify-center gap-10 text-center" style="margin-bottom:1rem;">
            <div>
              <div class="color-highlight size-h3">{{ $count }}</div>
              <div class="size-h6">ACTIVE {{ if eq $count 1 }}DELIVERY{{ else }}DELIVERIES{{ end }}</div>
            </div>
          </div>

          {{/* Map status codes to readable text and colors using if/else */}}

          {{/* Display deliveries */}}
          <ul class="list list-gap-14 {{ if not $showAll }}collapsible-container{{ end }}"
              {{ if not $showAll }}data-collapse-after="{{ $collapseAfter }}"{{ end }}
              style="padding-left: 0; margin: 0;">
            {{ range $index, $delivery := $deliveries }}
              {{ $description := $delivery.String "description" }}
              {{ $trackingNumber := $delivery.String "tracking_number" }}
              {{ $carrierCode := $delivery.String "carrier_code" }}
              {{ $statusCode := $delivery.Int "status_code" }}
              {{ $dateExpected := $delivery.String "date_expected" }}
              {{ $events := $delivery.Array "events" }}

              {{/* Get status info */}}
              {{ $statusText := "Unknown" }}
              {{ $statusColor := "var(--color-text)" }}
              {{ $statusIcon := "📦" }}
              {{ if eq $statusCode 0 }}
                {{ $statusText = "Delivered" }}
                {{ $statusColor = "var(--color-positive)" }}
                {{ $statusIcon = "✓" }}
              {{ else if eq $statusCode 1 }}
                {{ $statusText = "Frozen" }}
                {{ $statusColor = "var(--color-subdue)" }}
                {{ $statusIcon = "❄" }}
              {{ else if eq $statusCode 2 }}
                {{ $statusText = "In Transit" }}
                {{ $statusColor = "var(--color-primary)" }}
                {{ $statusIcon = "🚚" }}
              {{ else if eq $statusCode 3 }}
                {{ $statusText = "Ready for Pickup" }}
                {{ $statusColor = "var(--color-highlight)" }}
                {{ $statusIcon = "📦" }}
              {{ else if eq $statusCode 4 }}
                {{ $statusText = "Out for Delivery" }}
                {{ $statusColor = "var(--color-positive)" }}
                {{ $statusIcon = "🚛" }}
              {{ else if eq $statusCode 5 }}
                {{ $statusText = "Not Found" }}
                {{ $statusColor = "var(--color-negative)" }}
                {{ $statusIcon = "❌" }}
              {{ else if eq $statusCode 6 }}
                {{ $statusText = "Failed Delivery" }}
                {{ $statusColor = "var(--color-negative)" }}
                {{ $statusIcon = "⚠" }}
              {{ else if eq $statusCode 7 }}
                {{ $statusText = "Exception" }}
                {{ $statusColor = "var(--color-negative)" }}
                {{ $statusIcon = "⚠" }}
              {{ else if eq $statusCode 8 }}
                {{ $statusText = "Info Received" }}
                {{ $statusColor = "var(--color-subdue)" }}
                {{ $statusIcon = "📋" }}
              {{ end }}

              {{/* Truncate description if too long */}}
              {{ $displayDescription := $description }}
              {{ if gt (len $description) $maxDescLength }}
                {{ $displayDescription = print (slice $description 0 $maxDescLength) "…" }}
              {{ end }}

              {{/* Get latest event */}}
              {{ $latestEvent := "" }}
              {{ $latestDate := "" }}
              {{ $latestLocation := "" }}
              {{ if gt (len $events) 0 }}
                {{ $firstEvent := index $events 0 }}
                {{ $latestEvent = $firstEvent.String "event" }}
                {{ $latestDate = $firstEvent.String "date" }}
                {{ $latestLocation = $firstEvent.String "location" }}
              {{ end }}

              <li style="list-style: none; border-left: 3px solid {{ $statusColor | safeCSS }}; padding-left: 12px; padding-bottom: 8px; padding-top: 8px; background: rgba(255,255,255,0.02); border-radius: 4px;">
                {{/* Delivery header with description and status */}}
                <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 6px;">
                  <div style="flex: 1; min-width: 0;">
                    <div class="color-highlight size-h4" style="font-weight: 500; margin-bottom: 3px;" title="{{ $description }}">
                      {{ $displayDescription }}
                    </div>
                    <div class="color-subdue" style="font-size: 0.85em;">
                      {{ $carrierCode }} • {{ $trackingNumber }}
                    </div>
                  </div>
                  <div style="margin-left: 10px; white-space: nowrap;">
                    <span style="color: {{ $statusColor | safeCSS }}; font-size: 1.2em; margin-right: 4px;">{{ $statusIcon }}</span>
                    <span class="size-h5" style="color: {{ $statusColor | safeCSS }};">{{ $statusText }}</span>
                  </div>
                </div>

                {{/* Expected delivery date */}}
                {{ if $dateExpected }}
                  <div style="font-size: 0.9em; margin-bottom: 4px; color: var(--color-text-highlight);">
                    📅 Expected: {{ $dateExpected }}
                  </div>
                {{ end }}

                {{/* Latest event */}}
                {{ if $latestEvent }}
                  <div style="font-size: 0.85em; color: var(--color-paragraph); margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,0.1);">
                    <div style="margin-bottom: 2px;">
                      <strong>Latest:</strong> {{ $latestEvent }}
                    </div>
                    {{ if $latestLocation }}
                      <div style="color: var(--color-subdue);">
                        📍 {{ $latestLocation }}
                      </div>
                    {{ end }}
                    {{ if $latestDate }}
                      <div style="color: var(--color-subdue); font-size: 0.9em;">
                        {{ $latestDate }}
                      </div>
                    {{ end }}
                  </div>
                {{ end }}
              </li>
            {{ end }}
          </ul>
        {{ end }}
      {{ end }}

