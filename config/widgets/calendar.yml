    <div class="dy-cal-sep"></div>

    {{/* ── Event list: next N upcoming ── */}}
    {{ $count := 0 }}
    {{ range $e := $events }}
      {{ if lt $count $maxEvents }}
        {{ $count    = add $count 1 }}
        {{ $dtstart := $e.String "dtstart" }}
        {{ $dtend   := $e.String "dtend" }}
        {{ $sum     := $e.String "summary" }}
        {{ $loc     := $e.String "location" }}
        {{ $allDay  := $e.Bool "allDay" }}
        {{ $ds      := slice $dtstart 0 10 }}
        {{ $dt      := parseTime "2006-01-02" $ds }}
        {{ $evDN    := add (mul $dt.Year 365) $dt.YearDay }}
        {{ $todayDN := add (mul $now.Year 365) $now.YearDay }}
        {{ $dAway   := sub $evDN $todayDN }}
        {{ $chip := "" }}{{ $chipCls := "" }}
        {{ if eq $dAway 0 }}{{ $chip = "today" }}{{ $chipCls = "is-today" }}
        {{ else if eq $dAway 1 }}{{ $chip = "tomorrow" }}{{ $chipCls = "is-soon" }}
        {{ else if lt $dAway 7 }}{{ $chip = printf "in %d days" $dAway }}{{ $chipCls = "is-soon" }}
        {{ else }}{{ $chip = $dt.Format "Jan 2" }}{{ $chipCls = "is-future" }}{{ end }}
        {{ $tStr := "" }}
        {{ if and (not $allDay) (gt (len $dtstart) 10) }}{{ $tStr = printf "%s – %s" (slice $dtstart 11 16) (slice $dtend 11 16) }}{{ end }}
        <div class="dy-cal-event">
          <div class="dy-cal-event-left">
            <span class="dy-cal-event-dow">{{ $dt.Format "Mon" }}</span>
            <span class="dy-cal-event-day{{ if eq $dAway 0 }} is-today{{ end }}">{{ $dt.Day }}</span>
          </div>
          <div class="dy-cal-event-body">
            <div class="dy-cal-event-title">{{ $sum }}</div>
            {{ if or $tStr $loc }}<div class="dy-cal-event-meta">{{ if $tStr }}<span class="dy-cal-event-time">{{ $tStr }}</span>{{ end }}{{ if $loc }}<span class="dy-cal-event-loc">{{ $loc }}</span>{{ end }}</div>{{ end }}
          </div>
          {{ if $chip }}<span class="dy-due-chip {{ $chipCls }}">{{ $chip }}</span>{{ end }}
        </div>
      {{ end }}
    {{ end }}
    {{ if eq $count 0 }}<div class="dy-empty">no upcoming events</div>{{ end }}
