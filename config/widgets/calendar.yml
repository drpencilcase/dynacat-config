# ── CONFIGURATION ────────────────────────────────────────────────────────────
# Set this variable in your .env file:
#
#   API_PROXY_URL   Base URL of your custom API proxy
#                   e.g. https://api-proxy.example.com
#
# The proxy must expose GET /calendar/events returning:
#   { events: [{ summary, dtstart, dtend, location, allDay, uid }], count }
# It handles CalDAV auth using CALENDAR_URL / CALENDAR_USER / CALENDAR_PASSWORD
# from your .env.
#
# Options (edit the options block below):
#   upcoming-events   How many upcoming events to list below the calendar grid
# ─────────────────────────────────────────────────────────────────────────────
- type: custom-api
  title: calendar
  cache: 15m
  options:
      upcoming-events: 5
  url: ${API_PROXY_URL}/calendar/events
  template: |
    {{ $events   := .JSON.Array "events" }}
    {{ $now      := now }}
    {{ $todayStr := $now.Format "2006-01-02" }}
    {{ $maxEvents := .Options.IntOr "upcoming-events" 5 }}

    {{/* Monday-first weekday offset: Mon=0 … Sun=6 */}}
    {{ $dow  := $now.Format "Mon" }}
    {{ $mOff := 0 }}
    {{ if eq $dow "Tue" }}{{ $mOff = 1 }}{{ end }}
    {{ if eq $dow "Wed" }}{{ $mOff = 2 }}{{ end }}
    {{ if eq $dow "Thu" }}{{ $mOff = 3 }}{{ end }}
    {{ if eq $dow "Fri" }}{{ $mOff = 4 }}{{ end }}
    {{ if eq $dow "Sat" }}{{ $mOff = 5 }}{{ end }}
    {{ if eq $dow "Sun" }}{{ $mOff = 6 }}{{ end }}

    {{/* Walk $ct to last week's Monday:
         go back 14 days, then forward (7-mOff) steps */}}
    {{ $ct := $now }}
    {{ $ct = $ct.AddDate 0 0 -1 }}{{ $ct = $ct.AddDate 0 0 -1 }}{{ $ct = $ct.AddDate 0 0 -1 }}{{ $ct = $ct.AddDate 0 0 -1 }}{{ $ct = $ct.AddDate 0 0 -1 }}{{ $ct = $ct.AddDate 0 0 -1 }}{{ $ct = $ct.AddDate 0 0 -1 }}
    {{ $ct = $ct.AddDate 0 0 -1 }}{{ $ct = $ct.AddDate 0 0 -1 }}{{ $ct = $ct.AddDate 0 0 -1 }}{{ $ct = $ct.AddDate 0 0 -1 }}{{ $ct = $ct.AddDate 0 0 -1 }}{{ $ct = $ct.AddDate 0 0 -1 }}{{ $ct = $ct.AddDate 0 0 -1 }}
    {{ if le $mOff 6 }}{{ $ct = $ct.AddDate 0 0 1 }}{{ end }}
    {{ if le $mOff 5 }}{{ $ct = $ct.AddDate 0 0 1 }}{{ end }}
    {{ if le $mOff 4 }}{{ $ct = $ct.AddDate 0 0 1 }}{{ end }}
    {{ if le $mOff 3 }}{{ $ct = $ct.AddDate 0 0 1 }}{{ end }}
    {{ if le $mOff 2 }}{{ $ct = $ct.AddDate 0 0 1 }}{{ end }}
    {{ if le $mOff 1 }}{{ $ct = $ct.AddDate 0 0 1 }}{{ end }}
    {{ if le $mOff 0 }}{{ $ct = $ct.AddDate 0 0 1 }}{{ end }}

    {{ $cd := "" }}{{ $ev := false }}{{ $tip := "" }}

    <div class="dy-cal-grid">
      <span class="dy-cal-dow">Mo</span><span class="dy-cal-dow">Tu</span><span class="dy-cal-dow">We</span><span class="dy-cal-dow">Th</span><span class="dy-cal-dow">Fr</span><span class="dy-cal-dow">Sa</span><span class="dy-cal-dow">Su</span>

      {{/* week 1 */}}
      {{ $cd = $ct.Format "2006-01-02" }}{{ $ev = false }}{{ $tip = "" }}{{ range $e := $events }}{{ if eq (slice ($e.String "dtstart") 0 10) $cd }}{{ $ev = true }}{{ $etm := "" }}{{ if and (not ($e.Bool "allDay")) (gt (len ($e.String "dtstart")) 10) }}{{ $etm = printf "%s " (slice ($e.String "dtstart") 11 16) }}{{ end }}{{ $esum := $e.String "summary" }}{{ if $tip }}{{ $tip = printf "%s · %s%s" $tip $etm $esum }}{{ else }}{{ $tip = printf "%s%s" $etm $esum }}{{ end }}{{ end }}{{ end }}<span class="dy-cal-day{{ if lt $cd $todayStr }} is-past{{ else if eq $cd $todayStr }} is-today{{ end }}{{ if $ev }} has-event{{ end }}"{{ if $tip }} data-tip="{{ $tip }}"{{ end }}>{{ $ct.Day }}</span>{{ $ct = $ct.AddDate 0 0 1 }}
      {{ $cd = $ct.Format "2006-01-02" }}{{ $ev = false }}{{ $tip = "" }}{{ range $e := $events }}{{ if eq (slice ($e.String "dtstart") 0 10) $cd }}{{ $ev = true }}{{ $etm := "" }}{{ if and (not ($e.Bool "allDay")) (gt (len ($e.String "dtstart")) 10) }}{{ $etm = printf "%s " (slice ($e.String "dtstart") 11 16) }}{{ end }}{{ $esum := $e.String "summary" }}{{ if $tip }}{{ $tip = printf "%s · %s%s" $tip $etm $esum }}{{ else }}{{ $tip = printf "%s%s" $etm $esum }}{{ end }}{{ end }}{{ end }}<span class="dy-cal-day{{ if lt $cd $todayStr }} is-past{{ else if eq $cd $todayStr }} is-today{{ end }}{{ if $ev }} has-event{{ end }}"{{ if $tip }} data-tip="{{ $tip }}"{{ end }}>{{ $ct.Day }}</span>{{ $ct = $ct.AddDate 0 0 1 }}
      {{ $cd = $ct.Format "2006-01-02" }}{{ $ev = false }}{{ $tip = "" }}{{ range $e := $events }}{{ if eq (slice ($e.String "dtstart") 0 10) $cd }}{{ $ev = true }}{{ $etm := "" }}{{ if and (not ($e.Bool "allDay")) (gt (len ($e.String "dtstart")) 10) }}{{ $etm = printf "%s " (slice ($e.String "dtstart") 11 16) }}{{ end }}{{ $esum := $e.String "summary" }}{{ if $tip }}{{ $tip = printf "%s · %s%s" $tip $etm $esum }}{{ else }}{{ $tip = printf "%s%s" $etm $esum }}{{ end }}{{ end }}{{ end }}<span class="dy-cal-day{{ if lt $cd $todayStr }} is-past{{ else if eq $cd $todayStr }} is-today{{ end }}{{ if $ev }} has-event{{ end }}"{{ if $tip }} data-tip="{{ $tip }}"{{ end }}>{{ $ct.Day }}</span>{{ $ct = $ct.AddDate 0 0 1 }}
      {{ $cd = $ct.Format "2006-01-02" }}{{ $ev = false }}{{ $tip = "" }}{{ range $e := $events }}{{ if eq (slice ($e.String "dtstart") 0 10) $cd }}{{ $ev = true }}{{ $etm := "" }}{{ if and (not ($e.Bool "allDay")) (gt (len ($e.String "dtstart")) 10) }}{{ $etm = printf "%s " (slice ($e.String "dtstart") 11 16) }}{{ end }}{{ $esum := $e.String "summary" }}{{ if $tip }}{{ $tip = printf "%s · %s%s" $tip $etm $esum }}{{ else }}{{ $tip = printf "%s%s" $etm $esum }}{{ end }}{{ end }}{{ end }}<span class="dy-cal-day{{ if lt $cd $todayStr }} is-past{{ else if eq $cd $todayStr }} is-today{{ end }}{{ if $ev }} has-event{{ end }}"{{ if $tip }} data-tip="{{ $tip }}"{{ end }}>{{ $ct.Day }}</span>{{ $ct = $ct.AddDate 0 0 1 }}
