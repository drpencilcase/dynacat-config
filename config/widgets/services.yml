                hide: false

      - type: docker-containers
        hide-by-default: true
        title: consume
        containers:
            tautulli:
                name: tautulli
                url: https://tautulli.${BASE_DOMAIN}
                icon: assets/icons/tautulli.png
                hide: false
            plex:
                name: plex
                url: https://plex.${BASE_DOMAIN}
                icon: assets/icons/plex.svg
                hide: false
            booklore:
                name: booklore
                url: https://booklore.${BASE_DOMAIN}
                icon: assets/icons/grimmory.svg
                hide: false
            audiobookshelf:
                name: audiobookshelf
                url: https://audiobookshelf.${BASE_DOMAIN}
                icon: assets/icons/audiobookshelf.svg
                hide: false
            kavita:
                name: kavita
                url: https://kavita.${BASE_DOMAIN}
                icon: assets/icons/kavita.svg
                hide: false

      - type: docker-containers
        hide-by-default: true
        title: process
        containers:
            miniflux:
                name: miniflux
                url: https://miniflux.${BASE_DOMAIN}
                icon: assets/icons/miniflux.svg
                hide: false
            karakeep:
                name: karakeep
                url: https://karakeep.${BASE_DOMAIN}
                icon: assets/icons/karakeep.svg
                hide: false
            wallabag:
                name: wallabag
                url: https://wallabag.${BASE_DOMAIN}
                icon: assets/icons/wallabag.svg
                hide: false

      - type: docker-containers
        hide-by-default: true
        title: maintain
        containers:
            dozzle:
                name: dozzle
                url: https://dozzle.${BASE_DOMAIN}
                icon: assets/icons/dozzle.svg
                hide: false
            gitea:
                name: gitea
                url: https://gitea.${BASE_DOMAIN}
                icon: assets/icons/gitea.svg
                hide: false
            copyparty:
                name: copyparty
                url: https://copyparty.${BASE_DOMAIN}
                icon: assets/icons/copyparty.svg
                hide: false

      - type: monitor
        title: infer
        sites:
            - title: ""
              url: ${LEMONADE_URL}
              icon: assets/icons/lemonade.svg
            - title: ""
              url: ${OPENWEB_URL}
              icon: assets/icons/openweb.svg
