# ── CONFIGURATION ────────────────────────────────────────────────────────────
# Set this variable in your .env file:
#
#   BASE_DOMAIN   Your service domain, e.g. example.com
#                 All docker-container URLs are built as https://service.${BASE_DOMAIN}
#
#   LEMONADE_URL  Full URL for the Lemonade monitor site
#                 e.g. http://192.168.1.7:13305
#   OPENWEB_URL   Full URL for the OpenWebUI monitor site
#                 e.g. http://192.168.1.2:8088
#
# Add, remove, or rename container blocks to match your services.
# The category colour for each sub-widget is set in custom.css sections 10.
# ─────────────────────────────────────────────────────────────────────────────
- type: split-column
  widgets:
      - type: docker-containers
        hide-by-default: true
        title: fetch
        containers:
            radarr:
                name: radarr
                url: https://radarr.${BASE_DOMAIN}
                icon: assets/icons/radarr.svg
                hide: false
            sonarr:
                name: sonarr
                url: https://sonarr.${BASE_DOMAIN}
                icon: assets/icons/sonarr.svg
                hide: false
            bazarr:
                name: bazarr
                url: https://bazarr.${BASE_DOMAIN}
                icon: assets/icons/bazarr.svg
                hide: false
            prowlarr:
                name: prowlarr
                url: https://prowlarr.${BASE_DOMAIN}
                icon: assets/icons/prowlarr.svg
                hide: false
            sabnzbd:
